name: Java CA regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Checkout researcher certificate fixtures (pinned revision)
        uses: actions/checkout@v4
        with:
          repository: galadran/we-have-a-problem.com
          ref: 05ebae9f2895478c514e25e221614cf5248750a4
          path: upstream-chains
          persist-credentials: false
      - name: Checkout Janssen sources for outbound TLS audit (pinned revision)
        uses: actions/checkout@v4
        with:
          repository: JanssenProject/jans
          ref: 95f2eebb4bf725eae9415c5a8c69815dd92d4c80
          path: upstream-jans
          persist-credentials: false
          sparse-checkout: |
            jans-core/service/src/main/java/io/jans/service/net
            jans-auth-server/client/src/main/java/io/jans/as/client/util
            jans-fido2/server/src/main/java/io/jans/fido2/service/readiness
      - name: Audit Janssen outbound TLS client implementations
        run: python3 scripts/audit-upstream-janssen.py upstream-jans
      - name: Reproduce CIBA HTTP client bugs (real upstream ClientUtil, loopback TLS)
        # Compiles the pinned upstream ClientUtil.createHttpClient and a patched copy,
        # drives both against loopback HTTPS servers with synthetic certificates.
        # Asserts the pinned source reproduces the premature connection-manager close and
        # the patched source executes requests, rejects hostname mismatches and untrusted certs.
        run: bash repro/run-ciba-repro.sh upstream-jans/jans-auth-server/client/src/main/java/io/jans/as/client/util/ClientUtil.java
      - name: Compile standalone TLS probe
        run: |
          mkdir -p build
          javac --release 17 -d build src/TlsProbe.java src/OfflineChainProbe.java src/HttpClientProbe.java
      - name: Verify authoritative certificate fingerprint manifest
        run: python3 scripts/verify_manifest.py
      - name: Offline PKIX chain coverage (16 fixtures, both image families)
        run: bash scripts/check-offline.sh
      - name: Custom truststore regression (demonstrate unsafe override)
        run: bash scripts/check-custom-truststore.sh
      - name: JDK HttpClient outbound HTTPS (patched runtime)
        run: |
          image='bellsoft/liberica-openjdk-alpine:17.0.21@sha256:a16eb904aa472d560ff3fb6a77de0efc3482be938210d2caef0bd1f89c10d356'
          docker run --rm -v "$PWD/build:/probe:ro" --entrypoint java "$image" -cp /probe HttpClientProbe reject https://dv-g3b-emudhra.we-have-a-problem.com/
          docker run --rm -v "$PWD/build:/probe:ro" --entrypoint java "$image" -cp /probe HttpClientProbe accept https://example.com/
      - name: Compare Janssen base images
        run: bash scripts/check-images.sh
